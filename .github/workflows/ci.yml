name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tinypay
          POSTGRES_PASSWORD: tinypay
          POSTGRES_DB: tinypay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tinypay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tinypay:tinypay@localhost:5432/tinypay
      APP_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma migrate deploy

      - run: pnpm run lint

      - run: pnpm run build

      - run: pnpm run test

      - run: pnpm run test:e2e
