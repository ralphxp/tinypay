# Reverse proxy: public HTTPS (added by certbot) -> the app on localhost:3000.
# Install at /etc/nginx/sites-available/tinypay, symlink into sites-enabled,
# replace YOUR_DOMAIN, then run certbot (see DEPLOY.md) — it rewrites this
# file to add the SSL server block automatically.
server {
    listen 80;
    server_name YOUR_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
