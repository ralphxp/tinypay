services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tinypay
      POSTGRES_PASSWORD: tinypay
      POSTGRES_DB: tinypay
    ports:
      - '5432:5432'
    volumes:
      - tinypay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tinypay']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host 6380 -> container 6379: the host's own Redis-compatible service
      # (system valkey) already owns 6379 locally.
      - '6380:6379'
    volumes:
      - tinypay_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tinypay_postgres_data:
  tinypay_redis_data:
