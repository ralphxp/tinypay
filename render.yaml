# Render Blueprint — lets Render auto-detect this service when you connect
# the repo (New -> Blueprint), instead of configuring it by hand. Secrets
# (DATABASE_URL, PAYSTACK_*, BIGISUB_*, TELEGRAM_*) are deliberately left
# out of here — set those in the Render dashboard (Environment tab) after
# the service is created, never committed to the repo.
services:
  - type: web
    name: tinypay
    runtime: node
    plan: free
    region: frankfurt
    # corepack enable is needed because Render's Node image only ships npm/yarn
    # by default — without it, `pnpm` isn't on PATH at all. SKIP_INSTALL_DEPS
    # stops Render's own implicit `npm install` from running first (which is
    # what actually broke the first deploy: it installed without devDependencies,
    # so `nest` — the build tool, from @nestjs/cli — was never on disk).
    # prisma generate is explicit here, not left to package.json's postinstall
    # hook — a frozen-lockfile install that finds node_modules already
    # satisfying the (unchanged) lockfile can skip re-running postinstall
    # entirely, which once left a stale Prisma Client (missing a newly added
    # model) baked into a build whose only change was to schema.prisma.
    buildCommand: corepack enable; pnpm install --frozen-lockfile; pnpm exec prisma generate; pnpm exec prisma migrate deploy; pnpm run build;
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_INSTALL_DEPS
        value: true
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: BIGISUB_API_TOKEN
        sync: false
      - key: BIGISUB_TRANSACTION_PIN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
